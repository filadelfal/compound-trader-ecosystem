apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-coach
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-coach
  template:
    metadata:
      labels:
        app: ai-coach
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ai-coach
          image: compoundtrader/ai-coach:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3008
          env:
            - name: PORT
              value: "3008"
            - name: SERVICE_NAME
              value: "ai-coach"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3008
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-coach
  namespace: compound-trader
spec:
  selector:
    app: ai-coach
  ports:
    - name: http
      port: 3008
      targetPort: 3008
