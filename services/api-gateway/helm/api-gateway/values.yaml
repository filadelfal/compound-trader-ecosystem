replicaCount: 2
image:
  repository: compoundtrader/api-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 3022
config:
  jwtSecretName: compound-runtime-secrets
  jwtSecretKey: jwt-access-secret
  jwtIssuer: compound-trader
  jwtAudience: compound-trader-platform
  userManagementUrl: http://user-management:3002
  tradingEngineUrl: http://trading-engine:3003
  marketDataUrl: http://market-data:3004
  upstreamTimeoutMs: 5000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
