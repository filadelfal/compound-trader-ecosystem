apiVersion: apps/v1
kind: Deployment
metadata:
  name: future-ai
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: future-ai
  template:
    metadata:
      labels:
        app: future-ai
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: future-ai
          image: compoundtrader/future-ai:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3025
          env:
            - name: PORT
              value: "3025"
            - name: SERVICE_NAME
              value: "future-ai"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3025
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3025
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: future-ai
  namespace: compound-trader
spec:
  selector:
    app: future-ai
  ports:
    - name: http
      port: 3025
      targetPort: 3025
