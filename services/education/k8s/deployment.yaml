apiVersion: apps/v1
kind: Deployment
metadata:
  name: education
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: education
  template:
    metadata:
      labels:
        app: education
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: education
          image: compoundtrader/education:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3018
          env:
            - name: PORT
              value: "3018"
            - name: SERVICE_NAME
              value: "education"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3018
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3018
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: education
  namespace: compound-trader
spec:
  selector:
    app: education
  ports:
    - name: http
      port: 3018
      targetPort: 3018
