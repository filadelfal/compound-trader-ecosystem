apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyst
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-analyst
  template:
    metadata:
      labels:
        app: ai-analyst
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ai-analyst
          image: compoundtrader/ai-analyst:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: SERVICE_NAME
              value: "ai-analyst"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analyst
  namespace: compound-trader
spec:
  selector:
    app: ai-analyst
  ports:
    - name: http
      port: 3005
      targetPort: 3005
