replicaCount: 2
image:
  repository: compoundtrader/market-data
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 3004
config:
  quoteStaleAfterSeconds: 60
  runtimeSecretName: compound-runtime-secrets
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
