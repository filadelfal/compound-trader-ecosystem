apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "market-data.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: market-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-data
    spec:
      containers:
        - name: market-data
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.runtimeSecretName }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.runtimeSecretName }}
                  key: redis-url
            - name: MARKET_DATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.runtimeSecretName }}
                  key: market-data-api-key
            - name: QUOTE_STALE_AFTER_SECONDS
              value: "{{ .Values.config.quoteStaleAfterSeconds }}"
          resources:
{{ toYaml .Values.resources | nindent 12 }}
