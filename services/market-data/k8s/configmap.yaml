apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-config
  namespace: compound-trader
data:
  PORT: "3004"
  SERVICE_NAME: "market-data"
  LOG_LEVEL: "INFO"
  JWT_ALGORITHM: "HS256"
  RATE_LIMIT_REQUESTS: "120"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  CORS_ALLOW_ORIGINS: "*"
  CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOW_HEADERS: "Authorization,Content-Type,X-API-Key,X-Correlation-ID"
  PROVIDER_PRIORITY: "twelvedata,alphavantage,polygon,binance,mt5"
