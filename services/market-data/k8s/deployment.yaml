apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: market-data
          image: compoundtrader/market-data:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: market-data-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: jwt-secret
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: api-keys
            - name: TWELVEDATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: twelvedata-api-key
            - name: ALPHAVANTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: alphavantage-api-key
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: polygon-api-key
            - name: MT5_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: mt5-base-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
