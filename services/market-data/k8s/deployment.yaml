apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: market-data
          image: compoundtrader/market-data:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: SERVICE_NAME
              value: "market-data"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: compound-trader
spec:
  selector:
    app: market-data
  ports:
    - name: http
      port: 3004
      targetPort: 3004
