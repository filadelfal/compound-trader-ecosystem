apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-engine
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: strategy-engine
  template:
    metadata:
      labels:
        app: strategy-engine
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: strategy-engine
          image: compoundtrader/strategy-engine:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3009
          env:
            - name: PORT
              value: "3009"
            - name: SERVICE_NAME
              value: "strategy-engine"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3009
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: strategy-engine
  namespace: compound-trader
spec:
  selector:
    app: strategy-engine
  ports:
    - name: http
      port: 3009
      targetPort: 3009
