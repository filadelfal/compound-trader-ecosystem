apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mobile-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mobile-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mobile-backend
    spec:
      containers:
        - name: mobile-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
          resources:
{{ toYaml .Values.resources | nindent 12 }}
