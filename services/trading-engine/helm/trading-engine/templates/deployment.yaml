apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trading-engine.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-engine
    spec:
      containers:
        - name: trading-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: PAPER_AUTOMATION_ENABLED
              value: "{{ .Values.paperAutomation.enabled }}"
            - name: PAPER_AUTOMATION_MODE
              value: "{{ .Values.paperAutomation.mode }}"
            {{- if .Values.paperAutomation.enabled }}
            - name: PAPER_AUTOMATION_REQUEST_URL
              value: "{{ required "paperAutomation.requestUrl is required when enabled" .Values.paperAutomation.requestUrl }}"
            {{- end }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
