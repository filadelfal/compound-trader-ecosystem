apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-engine
  template:
    metadata:
      labels:
        app: trading-engine
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: trading-engine
          image: compoundtrader/trading-engine:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: "trading-engine"
            - name: PAPER_AUTOMATION_ENABLED
              value: "false"
            - name: PAPER_AUTOMATION_MODE
              value: "PAPER"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trading-engine
  namespace: compound-trader
spec:
  selector:
    app: trading-engine
  ports:
    - name: http
      port: 3003
      targetPort: 3003
