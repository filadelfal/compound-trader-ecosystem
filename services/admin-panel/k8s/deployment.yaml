apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-panel
  template:
    metadata:
      labels:
        app: admin-panel
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: admin-panel
          image: compoundtrader/admin-panel:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3020
          env:
            - name: PORT
              value: "3020"
            - name: SERVICE_NAME
              value: "admin-panel"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3020
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3020
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-panel
  namespace: compound-trader
spec:
  selector:
    app: admin-panel
  ports:
    - name: http
      port: 3020
      targetPort: 3020
