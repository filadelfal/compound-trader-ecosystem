apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-audit
  namespace: compound-trader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-audit
  template:
    metadata:
      labels:
        app: security-audit
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: security-audit
          image: compoundtrader/security-audit:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3021
          env:
            - name: PORT
              value: "3021"
            - name: SERVICE_NAME
              value: "security-audit"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 3021
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3021
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: security-audit
  namespace: compound-trader
spec:
  selector:
    app: security-audit
  ports:
    - name: http
      port: 3021
      targetPort: 3021
