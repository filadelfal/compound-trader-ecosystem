apiVersion: batch/v1
kind: Job
metadata:
  name: user-management-migrate
  namespace: compound-trader
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: user-management-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/filadelfal/user-management@sha256:5db12fc54302d29314620ad74ed0f64402d01a7eaec69176eefb8e3547fdb5c0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/scripts/migrate.js
          env:
            - name: NODE_ENV
              value: development
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: redis-url
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: jwt-access-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: compound-runtime-secrets
                  key: jwt-refresh-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
