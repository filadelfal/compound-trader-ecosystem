                                                        "compound-net"
                                                    ]
                                   },
                     "postgres":  {
                                      "image":  "postgres:16-alpine",
                                      "environment":  {
                                                          "POSTGRES_USER":  "compound",
                                                          "POSTGRES_PASSWORD":  "${POSTGRES_PASSWORD:-compound_dev_password}",
                                                          "POSTGRES_DB":  "compound"
                                                      },
                                      "ports":  [
                                                    "5432:5432"
                                                ],
                                      "volumes":  [
                                                      "postgres_data:/var/lib/postgresql/data"
                                                  ],
                                      "healthcheck":  {
                                                          "test":  [
                                                                       "CMD-SHELL",
                                                                       "pg_isready -U compound -d compound"
                                                                   ],
                                                          "interval":  "10s",
                                                          "timeout":  "5s",
                                                          "retries":  10
                                                      },
                                      "restart":  "unless-stopped",
                                      "networks":  [
                                                       "compound-net"
                                                   ]
                                  },
                     "redis":  {
                                   "image":  "redis:7-alpine",
                                   "ports":  [
                                                 "6379:6379"
                                             ],
                                   "healthcheck":  {
                                                       "test":  [
                                                                    "CMD",
                                                                    "redis-cli",
                                                                    "ping"
                                                                ],
                                                       "interval":  "10s",
                                                       "timeout":  "5s",
                                                       "retries":  10
                                                   },
                                   "restart":  "unless-stopped",
                                   "networks":  [
                                                    "compound-net"
                                                ]
                               },
                     "prometheus":  {
                                        "image":  "prom/prometheus:v3.1.0",
                                        "ports":  [
                                                      "9090:9090"
                                                  ],
                                        "volumes":  [
                                                        "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
                                                        "./observability/operator-security-alerts.yml:/etc/prometheus/operator-security-alerts.yml:ro"
                                                    ],
                                        "restart":  "unless-stopped",
                                        "networks":  [
                                                         "compound-net"
                                                     ]
                                    },
                     "grafana":  {
                                     "image":  "grafana/grafana:11.4.0",
                                     "ports":  [
                                                   "3030:3000"
                                               ],
                                     "volumes":  [
                                                     "grafana_data:/var/lib/grafana"
                                                 ],
                                     "restart":  "unless-stopped",
                                     "networks":  [
                                                      "compound-net"
                                                  ]
                                 }
                 },
    "volumes":  {
                    "postgres_data":  {

                                      },
                    "grafana_data":  {

                                     }
                },
    "networks":  {
                     "compound-net":  {
                                          "driver":  "bridge"
                                      }
                 }
}
