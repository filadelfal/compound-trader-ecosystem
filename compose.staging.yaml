services:
  api-gateway:
    environment:
      NODE_ENV: production
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required for staging}"
      OPERATOR_ASSERTION_SECRET: "${OPERATOR_ASSERTION_SECRET:?OPERATOR_ASSERTION_SECRET is required for staging}"
      OPERATOR_ASSERTION_LIFETIME_SECONDS: "30"
    depends_on:
      user-management:
        condition: service_healthy
      trading-engine:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: "10m", max-file: "3"}

  user-management:
    environment:
      NODE_ENV: production
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required for staging}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required for staging}"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: "10m", max-file: "3"}

  trading-engine:
    ports: !reset []
    environment:
      OPERATOR_AUTH_ENABLED: "true"
      OPERATOR_ASSERTION_SECRET: "${OPERATOR_ASSERTION_SECRET:?OPERATOR_ASSERTION_SECRET is required for staging}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: "10m", max-file: "3"}

  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for staging}"
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  redis:
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}
