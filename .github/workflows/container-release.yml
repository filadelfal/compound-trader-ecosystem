name: Container Release

on:
  pull_request:
    paths:
      - ".github/workflows/container-release.yml"
      - "services/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate service release inputs
        shell: bash
        run: |
          mapfile -t services < <(find services -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort)
          test "${#services[@]}" -eq 25
          for service in "${services[@]}"; do
            test -f "services/$service/Dockerfile"
            test -f "services/$service/.dockerignore"
          done

  publish:
    if: github.event_name != 'pull_request'
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service:
          - admin-panel
          - ai-analyst
          - ai-coach
          - ai-mentor
          - ai-risk
          - alert-engine
          - analytics-engine
          - api-gateway
          - atlas-forge
          - backtest-engine
          - cloud-infra
          - community
          - education
          - future-ai
          - journal-engine
          - market-data
          - marketplace
          - mobile-backend
          - news-engine
          - portfolio-engine
          - propfirm-mode
          - security-audit
          - strategy-engine
          - trading-engine
          - user-management
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
