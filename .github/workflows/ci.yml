name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  user-management:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compound_test
          POSTGRES_PASSWORD: compound_test_password
          POSTGRES_DB: compound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compound_test -d compound_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/user-management
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://compound_test:compound_test_password@localhost:5432/compound_test
      TEST_DATABASE_URL: postgresql://compound_test:compound_test_password@localhost:5432/compound_test
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef-ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef-ci-refresh-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/user-management/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run unit and API tests
        run: npm test
      - name: Apply database migrations
        run: npm run migrate
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Validate Docker Compose
        run: docker compose -f compose.yaml config
      - name: Validate staging configuration
        env:
          POSTGRES_PASSWORD: ci-staging-postgres-password
          JWT_ACCESS_SECRET: ci-staging-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: ci-staging-refresh-secret-0123456789abcdef
          OPERATOR_ASSERTION_SECRET: ci-staging-operator-secret-0123456789abcdef-ci-staging-operator-secret
        run: |
          docker compose -f compose.yaml -f compose.staging.yaml config --quiet
          staging_config="$RUNNER_TEMP/staging-compose.yaml"
          docker compose -f compose.yaml -f compose.staging.yaml config > "$staging_config"
          if grep -q compound_dev_password "$staging_config"; then
            echo "Development database password leaked into staging configuration."
            exit 1
          fi
      - name: Lint Helm charts
        shell: bash
        run: |
          chart_count=0
          while IFS= read -r -d '' chart; do
            helm lint "$(dirname "$chart")"
            chart_count=$((chart_count + 1))
          done < <(find services -name Chart.yaml -print0)
          test "$chart_count" -eq 25
      - name: Validate raw Kubernetes manifests
        shell: bash
        run: |
          mapfile -d '' manifests < <(find services -path '*/k8s/*.yaml' -type f -print0 | sort -z)

          if [[ "${#manifests[@]}" -eq 0 ]]; then
            echo "No raw Kubernetes manifests were found."
            exit 1
          fi

          printf 'Validating %d raw Kubernetes manifests:\n' "${#manifests[@]}"
          printf ' - %s\n' "${manifests[@]}"

          container_paths=()
          for manifest in "${manifests[@]}"; do
            container_paths+=("/work/$manifest")
          done

          docker run --rm \
            --volume "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict \
            -summary \
            "${container_paths[@]}"

      - name: Build every service
        run: docker compose -f compose.yaml build
